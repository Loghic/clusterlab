name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  coverage:
    name: cargo-llvm-cov → codecov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install system dependencies
        # macroquad needs these to compile on Linux, even though we don't
        # actually render anything during `cargo test`.
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev pkg-config

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cov-${{ hashFiles('**/Cargo.toml') }}

      - name: Generate coverage (lcov format)
        # --all-features mirrors the clippy / test CI jobs.
        # --workspace covers the binary too, not just the lib.
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          # For public repos, no CODECOV_TOKEN is required.
          # For private repos, add CODECOV_TOKEN as a repo secret and
          # uncomment the next line:
          # token: ${{ secrets.CODECOV_TOKEN }}
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
