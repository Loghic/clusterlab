name: WASM build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (with wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install system dependencies
        # macroquad needs these to even type-check on Linux, even though
        # the actual wasm artifact doesn't depend on them at runtime.
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev pkg-config

      - name: Build wasm
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Assemble dist/
        run: |
          mkdir -p dist
          cp target/wasm32-unknown-unknown/release/clusterlab.wasm dist/
          cp web/index.html dist/
          # Download the macroquad/miniquad JS loader. This project pins
          # macroquad 0.4.14 and miniquad 0.4.8; the bundle on `master`
          # currently matches. Some `vX.Y.Z` tags don't include the `js/`
          # folder (404), so we use master here. If a future macroquad
          # bump on `master` ever tracks a newer miniquad than the one
          # in Cargo.lock, you'll get the "Version mismatch: gl.js
          # version is: 2, miniquad crate version is: 262144" error —
          # pin to a matching version tag at that point.
          curl -fL -o dist/mq_js_bundle.js \
            https://raw.githubusercontent.com/not-fl3/macroquad/master/js/mq_js_bundle.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
