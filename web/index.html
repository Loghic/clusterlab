<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>k-means visualizer</title>
    <style>
        html, body, canvas {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1c22;
        }
    </style>
</head>
<body>
    <canvas id="glcanvas" tabindex="1"></canvas>
    <!--
        IMPORTANT: do NOT use https://not-fl3.github.io/miniquad-samples/mq_js_bundle.js
        and do NOT use the master branch of macroquad. Both produce:
            "Version mismatch: gl.js version is: 2, miniquad crate version is: 262144"

        Use the matching version tag for whatever macroquad version is in
        Cargo.lock. This project pins macroquad 0.4.5, so fetch:
            https://raw.githubusercontent.com/not-fl3/macroquad/v0.4.5/js/mq_js_bundle.js

        Build steps locally:
            cargo build --release --target wasm32-unknown-unknown
            mkdir -p dist
            cp target/wasm32-unknown-unknown/release/kmeans-viz.wasm dist/
            cp web/index.html dist/
            curl -fL -o dist/mq_js_bundle.js \
                https://raw.githubusercontent.com/not-fl3/macroquad/v0.4.5/js/mq_js_bundle.js
            basic-http-server dist/

        If you upgrade macroquad in Cargo.toml, change the v0.4.5 in the URL
        above to the new version tag so the gl.js and the wasm crate versions
        stay in sync.
    -->
    <script src="mq_js_bundle.js"></script>
    <script>load("kmeans-viz.wasm");</script>
</body>
</html>
