<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>k-means visualizer</title>
    <style>
        html, body, canvas {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1c22;
        }
    </style>
</head>
<body>
    <canvas id="glcanvas" tabindex="1"></canvas>
    <!--
        IMPORTANT: do NOT use https://not-fl3.github.io/miniquad-samples/mq_js_bundle.js
        That hosted file is stale and produces:
            "Version mismatch: gl.js version is: 2, miniquad crate version is: 262144"

        Instead, fetch the bundle that matches the macroquad version this project
        depends on. The official source is in the macroquad repo, under js/:
            https://raw.githubusercontent.com/not-fl3/macroquad/master/js/mq_js_bundle.js

        Build steps locally:
            cargo build --release --target wasm32-unknown-unknown
            mkdir -p dist
            cp target/wasm32-unknown-unknown/release/kmeans-viz.wasm dist/
            cp web/index.html dist/
            curl -L -o dist/mq_js_bundle.js \
                https://raw.githubusercontent.com/not-fl3/macroquad/master/js/mq_js_bundle.js
            basic-http-server dist/

        If you ever upgrade macroquad in Cargo.toml, re-download mq_js_bundle.js
        from the matching tag (e.g. .../macroquad/v0.4.14/js/mq_js_bundle.js)
        so the gl.js and the wasm crate versions match.
    -->
    <script src="mq_js_bundle.js"></script>
    <script>load("kmeans-viz.wasm");</script>
</body>
</html>
