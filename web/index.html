<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>clusterlab</title>
    <style>
        html, body, canvas {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1c22;
        }
        /* Prevent text selection when the user holds shift while
           dragging the canvas. Also disables the iOS "select word"
           bubble on long-press. */
        canvas {
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
    </style>
</head>
<body>
    <canvas id="glcanvas" tabindex="1"></canvas>
    <!--
        IMPORTANT: do NOT use https://not-fl3.github.io/miniquad-samples/mq_js_bundle.js
        That hosted file is stale and produces:
            "Version mismatch: gl.js version is: 2, miniquad crate version is: 262144"

        Use the bundle that matches the macroquad version in Cargo.lock.
        This project pins macroquad 0.4.14 and miniquad 0.4.8; the bundle
        on `master` currently matches:
            https://raw.githubusercontent.com/not-fl3/macroquad/master/js/mq_js_bundle.js

        Build steps locally:
            cargo build --release --target wasm32-unknown-unknown
            mkdir -p dist
            cp target/wasm32-unknown-unknown/release/clusterlab.wasm dist/
            cp web/index.html dist/
            curl -fL -o dist/mq_js_bundle.js \
                https://raw.githubusercontent.com/not-fl3/macroquad/master/js/mq_js_bundle.js
            basic-http-server dist/

        If you bump macroquad in Cargo.toml and `master` starts tracking
        a NEWER miniquad than your Cargo.lock has, you'll hit the
        version-mismatch error again — pin to the matching `vX.Y.Z` tag
        instead. (Some old tags lack the `js/` folder and 404; fall back
        to `master` in that case.)
    -->
    <script>
        // Suppress the browser's right-click context menu over the canvas.
        // Macroquad uses right-click to rotate the 3D camera and pan the
        // 2D camera; without this listener the browser would show its
        // OS menu on every right-click and the app would get stuck
        // waiting for it to close.
        //
        // We attach the listener BEFORE loading the wasm so the canvas
        // element already exists. Returning false (and calling
        // preventDefault) is the cross-browser way to cancel.
        //
        // NOTE: mq_js_bundle.js declares its own top-level `const canvas`,
        // so we must NOT use that name here — a name collision in the
        // global scope triggers "redeclaration of const canvas" and the
        // bundle fails to load. Use a different identifier.
        (function () {
            const glcanvas = document.getElementById('glcanvas');
            glcanvas.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                return false;
            });
        })();
    </script>
    <script>var register_plugin;</script>
    <script src="mq_js_bundle.js"></script>
    <script>load("clusterlab.wasm");</script>
</body>
</html>
